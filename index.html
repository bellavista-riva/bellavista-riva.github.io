<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Menu Bellavista</title><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Serif+Hebrew:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Pinyon+Script&display=swap">
<style>
/* Layout: una colonna stretta da telefono. Fascia ornamentale marrone in testa (come il menu cartaceo),
   barra fissa con ricerca, filtro allergeni e sezioni, poi l'elenco dei piatti. */
:root{
  --bg:#fffdf9; --card:#ffffff; --ink:#2b2a29; --ink-2:#5d544b; --brown:#5f3812; --brown-2:#8a5a2b;
  --line:#e8ddcf; --chip:#f4ece1; --veg:#2f6f2a; --gf:#8f610c; --warn:#a4361f; --warn-bg:#fbeae5;
  --ring:transparent; --sheet:#fffdf9; --scrim:rgba(30,18,8,.5); --focus:#1a56db;
  --serif:'EB Garamond','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --ar:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;
  --he:'Noto Serif Hebrew','Frank Ruhl Libre','David',serif;
  --zh:'Noto Serif SC','Songti SC','SimSun','Source Han Serif SC',serif;
}
:root[data-mode="dark"]{
  --bg:#1b120a; --card:#241911; --ink:#f2e9dd; --ink-2:#c6b8a6; --brown:#e6b97e; --brown-2:#c9a06b;
  --line:#3b2b1d; --chip:#32241a; --veg:#8fd186; --gf:#e3b25a; --warn:#ffa58e; --warn-bg:#46231a;
  --ring:#e9d6bd; --sheet:#241911; --scrim:rgba(0,0,0,.62); --focus:#8ab4ff; color-scheme:dark}
html,body{margin:0}
html{overflow-x:hidden;overscroll-behavior-y:none}
.app{overflow-x:clip;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app *{min-width:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.4;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.app[lang="zh"]{font-family:var(--zh)}
.app[lang="ar"]{font-family:var(--ar);line-height:1.6}
.app[lang="he"]{font-family:var(--he);line-height:1.5}
.app[lang="zh"] i,.app[lang="ar"] i,.app[lang="he"] i,.app[lang="zh"] .itn,.app[lang="ar"] .itn,.app[lang="he"] .itn{font-style:normal}
.wrap{max-width:720px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.ai{width:20px;height:20px;flex:0 0 auto;border-radius:50%;box-shadow:0 0 0 1.5px var(--ring)}

/* ---------- landing ---------- */
.hero{background:#fff}
.hero img{width:100%;max-width:720px;height:auto;display:block;margin-inline:auto}
.lp{padding-block:14px 32px}
.lp .eyebrow{margin:0;color:var(--brown);letter-spacing:.1em;text-transform:uppercase;font-size:13.5px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 1.1em}
.lp .eyebrow span{unicode-bidi:isolate}
.lp h1{margin:4px 0 14px;font-weight:500;font-size:25px;line-height:1.2;text-align:center;text-wrap:balance}
.lp h1 span{display:block;font-size:19px;color:var(--ink-2);font-style:italic;font-weight:400}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:8px 14px;direction:ltr;-webkit-tap-highlight-color:transparent;
  border:1px solid var(--line);background:var(--card);border-radius:10px;text-decoration:none;cursor:pointer;text-align:start}
.lbtn:hover{border-color:var(--brown-2)}
.lbtn .ln{font-size:20px;line-height:1.15;font-weight:500;unicode-bidi:isolate;min-width:0}
.lbtn .lc{font-size:12px;letter-spacing:.12em;color:var(--brown);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--serif)}
.lbtn.last{border-color:var(--brown);box-shadow:inset 0 0 0 1px var(--brown)}
.addr{margin-top:26px;text-align:center;color:var(--ink-2);font-size:15px;line-height:1.5}
.addr b{display:block;color:var(--ink);font-weight:500;font-size:17px}
.soc{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.soc .s{display:inline-flex;align-items:center;gap:8px;min-height:30px;max-width:100%;overflow-wrap:anywhere;text-align:start}
.soc svg{width:22px;height:22px;flex:0 0 auto}

.top::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(30,16,6,.15),rgba(30,16,6,.55))}
.top .wrap{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:20px 18px}
.brand{font-family:var(--script);font-size:46px;line-height:1;margin:0;font-weight:400;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.brand{min-width:0}
.brand small{display:block;font-family:var(--serif);font-size:11.5px;letter-spacing:.2em;margin-top:5px;text-transform:uppercase;line-height:1.35}
.langpill{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;border:1px solid rgba(255,255,255,.7);background:rgba(30,16,6,.35);color:#fff;border-radius:999px;padding:0 14px;font-size:15px;cursor:pointer;white-space:nowrap}
.langpill svg{width:15px;height:15px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px 0}
.srow{display:flex;gap:8px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;height:44px;margin-top:8px}
.sbtn{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.sbtn svg{width:19px;height:19px}
.sbtn[aria-pressed="true"]{background:var(--brown);border-color:var(--brown);color:var(--bg)}
.search svg{width:17px;height:17px;flex:0 0 auto;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:42px;font-size:16px}
.fbtn{flex:1 1 auto;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 15px;-webkit-tap-highlight-color:transparent;border-radius:999px;border:1px solid var(--brown);
  background:var(--card);color:var(--brown);cursor:pointer;font-weight:500;font-size:15.5px}
.fbtn svg{width:17px;height:17px;flex:0 0 auto}
#flabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fbtn[aria-pressed="true"]{background:var(--brown);color:var(--bg)}
.fbtn .n{min-width:20px;height:20px;border-radius:10px;background:var(--bg);color:var(--brown);font-size:13px;display:inline-grid;place-items:center;padding:0 5px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15.5px;white-space:nowrap}
.chip[aria-current="true"]{background:var(--brown);color:var(--bg)}
.activef{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 2px;font-size:14px;color:var(--ink-2)}
.activef .tag{display:inline-flex;align-items:center;gap:5px;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:2px 10px 2px 4px;font-size:13.5px}
.activef .tag .ai{width:16px;height:16px}
.hid{margin:12px 0 0;font-size:14px;color:var(--ink-2);font-style:italic}
main{padding-block:6px calc(40px + env(safe-area-inset-bottom,0px))}
.sec{padding-top:10px;scroll-margin-top:var(--barh,130px)}
.sec h2{margin:18px 0 4px;font-size:30px;line-height:1.1;font-weight:400;color:var(--brown);text-wrap:balance}
.gh{margin:20px 0 2px;font-size:20px;font-weight:700;color:var(--brown);line-height:1.2}
.dish{padding:13px 0 12px;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.dh h3{margin:0;font-size:19.5px;line-height:1.25;font-weight:700;min-width:0;text-wrap:pretty}
.dh sup{font-weight:400;color:var(--ink-2)}
.pr{flex:0 0 auto;text-align:end;font-variant-numeric:tabular-nums;font-size:18px;white-space:nowrap}
.pr div{display:flex;gap:10px;justify-content:flex-end}
.pr .vo{color:var(--ink-2);font-size:14.5px;align-self:center}
.dd{margin:3px 0 0;color:var(--ink-2);font-size:16px;line-height:1.38}
.itn{margin:5px 0 0;font-size:16px;font-weight:500;line-height:1.3;color:var(--ink)}
.itn span{letter-spacing:.05em;text-transform:uppercase;font-weight:400;font-size:11.5px;margin-inline-end:6px;color:var(--brown-2)}
.nt{margin:4px 0 0;font-size:14.5px;color:var(--brown);font-style:italic}
.tags{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px 12px}
.tags li{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--ink-2);line-height:1.1}
.tags li.v{color:var(--veg)} .tags li.g{color:var(--gf)}
.tags li.hit{color:var(--warn);font-weight:700}
.tags li.poss{color:var(--ink-2)}
.tags li.poss i{font-size:12.5px}
.flag.ask.strong{background:var(--warn-bg);color:var(--warn)}
.tags li.side{color:var(--brown);font-weight:700}
.tags .ai{width:18px;height:18px}
.flag{margin:8px 0 0;padding:7px 10px;border-radius:8px;font-size:14.5px;line-height:1.3}
.flag.no{background:var(--warn-bg);color:var(--warn)}
.flag.ask{background:var(--chip);color:var(--ink)}
.flag.side{background:var(--chip);color:var(--brown);border:1px dashed var(--brown-2)}
.dish.off .dh,.dish.off .dd,.dish.off .itn{opacity:.5}
.empty{padding:36px 0;text-align:center;color:var(--ink-2)}
.fin{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.fin p{margin:0 0 6px}
.fin .cov{font-size:16px;color:var(--ink)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;height:100dvh;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:720px;max-height:92%;max-height:92dvh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
.sh h2{margin:0;font-size:24px;font-weight:500;line-height:1.2}
.x{border:0;background:var(--chip);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.sb{overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px))}
.sb p.help{margin:0 0 10px;color:var(--ink-2);font-size:15.5px;line-height:1.35}
.sb h4{margin:14px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);font-weight:500}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{display:flex;align-items:center;gap:9px;min-height:46px;padding:6px 10px;border:1px solid var(--line);background:var(--card);border-radius:10px;
  cursor:pointer;text-align:start;font-size:15.5px;line-height:1.15}
.t .ai{width:26px;height:26px}
.t[aria-pressed="true"]{background:var(--brown);border-color:var(--brown);color:var(--bg)}
.t[aria-pressed="true"] .ai{box-shadow:0 0 0 1.5px var(--bg)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;font-size:16px}
.sw input{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--brown)}
.sw input:checked::after{transform:translateX(18px)}
[dir="rtl"] .sw input:checked::after{transform:translateX(-18px)}
.wn{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14.5px;line-height:1.35}
.sf{display:flex;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.btn{height:48px;border-radius:999px;border:1px solid var(--brown);background:transparent;color:var(--brown);padding:0 20px;cursor:pointer;font-weight:500;font-size:16px}
.btn.p{flex:1;background:var(--brown);color:var(--bg)}
.ls{display:grid;gap:8px}
.lbtn,.t,.chip,.fbtn,.sbtn,.hbtn,.langpill,.btn,.x,.tbtn{transition:transform .08s ease}
.lbtn:active,.t:active,.chip:active,.fbtn:active,.sbtn:active,.hbtn:active,.langpill:active,.btn:active,.x:active,.tbtn:active{transform:scale(.97)}
#landing,#menu{animation:vin .2s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.brand{cursor:pointer}
.tbtn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(30,16,6,.35);color:#fff;display:grid;place-items:center;cursor:pointer}
.tbtn svg{width:19px;height:19px}
.tools{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.hbtn{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--brown);cursor:pointer;display:grid;place-items:center}
.hbtn svg{width:21px;height:21px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (max-width:360px){.lbtn{padding:8px 10px}.lbtn .ln{font-size:19px}.lbtn .lc{display:none}.t{padding:6px 8px;font-size:15px}.t .ai{width:24px;height:24px}.fbtn{padding:0 10px}}
</style>

  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a8.5 8.5 0 1 0 10.6 10.6z"/></svg>';
let mode = store.get('bv-m') === 'dark' ? 'dark' : 'light';
const st = {lang:null, al:new Set(), veg:false, vegan:false, hide:true, q:''};
try { const f = JSON.parse(store.get('bv-f') || 'null');
  if (f) { st.al = new Set(f.al || []); st.veg = !!f.veg; st.vegan = !!f.vegan; st.hide = f.hide !== false; } } catch(e){}
const saveF = () => store.set('bv-f', JSON.stringify({al:[...st.al], veg:st.veg, vegan:st.vegan, hide:st.hide}));
const T = (k, v) => {
  let s = ((D.ui[st.lang] || {})[k]) ?? D.ui.en[k] ?? k;
  if (v) for (const x in v) s = s.replace('{' + x + '}', v[x]);
  return s;
};
function applyMode(){
  document.documentElement.setAttribute('data-mode', mode);
  const b = $('#theme'); if (!b) return;
  b.setAttribute('aria-pressed', mode === 'dark' ? 'true' : 'false');
  const l = T(mode === 'dark' ? 'toLight' : 'toDark'); b.setAttribute('aria-label', l); b.title = l;
  b.innerHTML = mode === 'dark' ? SUN : MOON;
}
const ico = c => '<svg class="ai" viewBox="0 0 24 24" aria-hidden="true"><use href="#' + c + '"/></svg>';
const filtersOn = () => st.al.size > 0 || st.veg || st.vegan;
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const RTL = new Set(['ar', 'he']);
const FOOD = new Set(['antipasti','primi','primipesce','secondi','pesce','insalate','pizze','dessert','caffe']);

/* ----- valutazione di un piatto rispetto ai filtri ----- */
function evalItem(it, secId){
  const side = it.sd || [];
  const bad = it.a.filter(a => st.al.has(a) && !side.includes(a));
  const sideHit = it.a.filter(a => st.al.has(a) && side.includes(a));
  let dietFail = false;
  if (FOOD.has(secId) && secId !== 'caffe') {
    if (st.vegan && !it.g.includes('VG')) dietFail = true;
    else if (st.veg && !(it.g.includes('V') || it.g.includes('VG'))) dietFail = true;
  }
  const possHit = (it.ps || []).filter(a => st.al.has(a));
  const unsuitable = bad.length > 0 || dietFail;
  let match = true;
  if (st.q) {
    const q = norm(st.q), L = it.l[st.lang] || it.l.en, I = it.l.it;
    match = norm([L.t, L.d, I.t, I.d].join(' ')).includes(q);
  }
  return {bad, sideHit, possHit, dietFail, unsuitable, match, show: match && (!unsuitable || !st.hide)};
}
function countShown(){
  let n = 0;
  D.sections.forEach(s => s.groups.forEach(g => g.items.forEach(it => { if (evalItem(it, s.id).show) n++; })));
  return n;
}

/* ----- HTML di un piatto ----- */
function price(it){
  if (!it.p.length) return '';
  return '<div class="pr">' + it.p.map(p =>
    '<div>' + (p.l ? '<span class="vo">' + esc(p.l) + '</span>' : '') + '<bdi dir="ltr">€ ' + esc(p.v) + '</bdi></div>').join('') + '</div>';
}
function dishHtml(it, ev){
  const L = it.l[st.lang] || it.l.en, I = it.l.it;
  const stars = it.st ? '<sup>' + it.st + '</sup>' : '';
  let h = '<article class="dish' + (ev.unsuitable ? ' off' : '') + '"><div class="dh"><h3>' + esc(L.t) + stars + '</h3>' + price(it) + '</div>';
  if (L.d) h += '<p class="dd">' + esc(L.d) + '</p>';
  if (st.lang !== 'it' && it.k !== 'pz' && L.t !== I.t)
    h += '<p class="itn"><span>' + esc(T('italian')) + '</span>' + esc(I.t) + '</p>';
  if (ev.sideHit.length) h += '<p class="flag side">' + esc(T('sideMustard')) + '</p>';
  else if (it.n === 'mustard') h += '<p class="nt">' + esc(T('noteTartare')) + '</p>';
  if (it.n === 'bread') h += '<p class="nt">' + esc(T('noteBread')) + '</p>';
  const tags = [];
  if (it.g.includes('VG')) tags.push('<li class="v">' + ico('dVG') + esc(D.diet.VG[st.lang]).split(' (')[0] + '</li>');
  else if (it.g.includes('V')) tags.push('<li class="v">' + ico('dV') + esc(D.diet.V[st.lang]) + '</li>');
  if (it.g.includes('GF')) tags.push('<li class="g">' + ico('dGF') + esc(D.diet.GF[st.lang]) + '</li>');
  it.a.forEach(a => tags.push('<li' + (ev.bad.includes(a) ? ' class="hit"' : ev.sideHit.includes(a) ? ' class="side"' : '') + '>' + ico('a' + a) + esc(D.all[a][st.lang]) + '</li>'));
  (it.ps || []).forEach(a => tags.push('<li class="poss' + (ev.possHit.includes(a) ? ' hit' : '') + '">' + ico('q' + a) + esc(D.all[a][st.lang]) + ' <i>(' + esc(T('possTag')) + ')</i></li>'));
  if (tags.length) h += '<ul class="tags">' + tags.join('') + '</ul>';
  if ((it.ps || []).length) h += '<p class="flag ask' + (ev.possHit.length ? ' strong' : '') + '">' + esc(T('possFlag')) + '</p>';
  if (ev.unsuitable && !st.hide) {
    const why = ev.bad.map(a => D.all[a][st.lang]);
    if (ev.dietFail) why.push((st.vegan ? D.diet.VG : D.diet.V)[st.lang] + ' ✕');
    h += '<p class="flag no">' + (ev.bad.length ? esc(T('contains')) + ': ' : '') + esc(why.join(', ')) + '</p>';
  }
  if (it.q && filtersOn()) h += '<p class="flag ask">' + esc(T('ask')) + '</p>';
  else if (it.q) h += '<p class="nt">' + esc(T('ask')) + '</p>';
  return h + '</article>';
}

/* ----- landing ----- */
const langBtn = (c, cur) => '<a class="lbtn' + (cur ? ' last' : '') + '" href="#' + c + '" data-l="' + c + '"><span class="ln" lang="' + c +
  '" dir="' + (RTL.has(c) ? 'rtl' : 'ltr') + '">' + esc(D.native[c]) + '</span><span class="lc">' + c.toUpperCase() + '</span></a>';
function showLanding(){
  $('#landing').hidden = false; $('#menu').hidden = true; closeSheet();
  app.dir = 'ltr'; app.lang = 'it'; document.title = 'Menu Bellavista';
  const last = store.get('bv-l');
  $('#langs').innerHTML = D.order.map(c => langBtn(c, c === last)).join('');
  window.scrollTo(0, 0);
}

/* ----- menu ----- */
let spy = [];
function showMenu(){
  $('#landing').hidden = true; $('#menu').hidden = false;
  app.dir = RTL.has(st.lang) ? 'rtl' : 'ltr'; app.lang = st.lang;
  $('#tag').textContent = T('tagline'); applyMode();
  $('#langname').textContent = st.lang.toUpperCase(); $('#langbtn').setAttribute('aria-label', T('lang') + ': ' + D.native[st.lang]); $('#langbtn').title = D.native[st.lang];
  $('#home').setAttribute('aria-label', T('home')); $('#home').title = T('home');
  $('#q').placeholder = T('search'); $('#q').setAttribute('aria-label', T('search')); $('#sbtn').setAttribute('aria-label', T('search'));
  $('#flabel').textContent = T('filterBtn');
  renderMenu(true);
}
function renderMenu(scrollTop){
  const secs = [], chips = []; let hiddenN = 0, any = false, usedStar = new Set();
  D.sections.forEach(s => {
    let body = '', n = 0;
    s.groups.forEach(g => {
      let gi = '', gc = 0;
      g.items.forEach(it => {
        const ev = evalItem(it, s.id);
        if (ev.show) { gi += dishHtml(it, ev); gc++; if (it.st) usedStar.add(it.st); }
        else if (ev.match && ev.unsuitable) hiddenN++;
      });
      if (gc) { body += (g.names ? '<h3 class="gh">' + esc(g.names[st.lang]) + '</h3>' : '') + gi; n += gc; }
    });
    if (n) { any = true;
      secs.push('<section class="sec" id="s-' + s.id + '"><h2>' + esc(s.names[st.lang]) + '</h2>' + body + '</section>');
      chips.push('<button class="chip" type="button" data-go="s-' + s.id + '">' + esc(s.names[st.lang]) + '</button>'); }
  });
  let top = '';
  if (filtersOn()) {
    const tg = [...st.al].sort((a,b)=>a-b).map(a => '<span class="tag">' + ico('a' + a) + esc(D.all[a][st.lang]) + '</span>');
    if (st.vegan) tg.push('<span class="tag">' + ico('dVG') + esc(D.diet.VG[st.lang]).split(' (')[0] + '</span>');
    else if (st.veg) tg.push('<span class="tag">' + ico('dV') + esc(D.diet.V[st.lang]) + '</span>');
    top = '<div class="activef"><span>' + esc(T('active')) + ':</span>' + tg.join('') + '</div>';
  }
  if (hiddenN && st.hide && filtersOn()) top += '<p class="hid">' + esc(T('hidden', {n: hiddenN})) + '</p>';
  let fin = '<div class="fin"><p class="cov">' + esc(T('cover')) + ' € 2,70 · ' + esc(T('prices')) + '</p>';
  if (usedStar.has('*')) fin += '<p>' + esc(T('frozen')) + '</p>';
  if (usedStar.has('**')) fin += '<p>' + esc(T('blast')) + '</p>';
  fin += '<p>' + esc(T('staff')) + '</p></div>';
  $('#main').innerHTML = (top ? '<div class="topinfo">' + top + '</div>' : '') +
    (any ? secs.join('') : '<p class="empty">' + esc(T('none')) + '</p>') + fin;
  $('#chips').innerHTML = chips.join('');
  const fn = $('#fn'); fn.hidden = !filtersOn(); fn.textContent = st.al.size + (st.veg || st.vegan ? 1 : 0);
  $('#fbtn').setAttribute('aria-pressed', filtersOn() ? 'true' : 'false');
  spy = [...document.querySelectorAll('.sec')];
  setBarH(); onScroll();
  if (scrollTop) window.scrollTo(0, 0);
}
function setBarH(){ const b = $('#bar'); if (b) document.documentElement.style.setProperty('--barh', (b.offsetHeight + 8) + 'px'); }
function onScroll(){
  if (!spy.length) return;
  const y = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--barh')) || 130) + 20;
  let cur = spy[0].id;
  spy.forEach(s => { if (s.getBoundingClientRect().top - y <= 0) cur = s.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.go === cur;
    if (on) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current');
    if (on) { const p = c.parentElement, r = c.getBoundingClientRect(), pr = p.getBoundingClientRect();
      if (r.left < pr.left || r.right > pr.right) p.scrollTo({left: p.scrollLeft + r.left - pr.left - 16, behavior: 'smooth'}); }
  });
}

/* ----- sheet (lingua / filtro) ----- */
function setSearch(on){
  $('#srow2').hidden = !on; $('#sbtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  if (on) $('#q').focus(); else if (st.q) { $('#q').value = ''; st.q = ''; renderMenu(false); }
  setBarH();
}
let sheetKind = null;
function openSheet(kind){
  sheetKind = kind; const body = $('#sbody'), foot = $('#sfoot');
  $('#xbtn').setAttribute('aria-label', T('close'));
  if (kind === 'lang') {
    $('#sheett').textContent = T('lang');
    body.innerHTML = '<div class="ls">' + D.order.map(c => langBtn(c, c === st.lang)).join('') + '</div>';
    foot.innerHTML = ''; foot.hidden = true;
  } else {
    $('#sheett').textContent = T('filterTitle'); foot.hidden = false; drawFilter();
  }
  $('#scrim').hidden = false; document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = $('#sheet').querySelector('button,a'); if (f) f.focus(); }, 0);
}
function drawFilter(){
  const body = $('#sbody');
  let h = '<p class="help">' + esc(T('filterHelp')) + '</p><h4>' + esc(T('dietsLbl')) + '</h4><div class="tg">' +
    '<button class="t" type="button" data-diet="veg" aria-pressed="' + st.veg + '">' + ico('dV') + '<span>' + esc(D.diet.V[st.lang]) + '</span></button>' +
    '<button class="t" type="button" data-diet="vegan" aria-pressed="' + st.vegan + '">' + ico('dVG') + '<span>' + esc(D.diet.VG[st.lang]) + '</span></button></div>' +
    '<h4>' + esc(T('allergensLbl')) + '</h4><div class="tg">';
  for (let a = 1; a <= 14; a++)
    h += '<button class="t" type="button" data-al="' + a + '" aria-pressed="' + st.al.has(a) + '">' + ico('a' + a) + '<span>' + esc(D.all[a][st.lang]) + '</span></button>';
  h += '</div><label class="sw"><span>' + esc(T('hideLbl')) + '</span><input id="hide" type="checkbox"' + (st.hide ? ' checked' : '') + '></label>' +
       '<p class="wn">' + esc(T('warn')) + '</p>';
  const sc = body.scrollTop; body.innerHTML = h; body.scrollTop = sc;
  $('#sfoot').innerHTML = '<button class="btn" id="clr" type="button">' + esc(T('clear')) + '</button>' +
    '<button class="btn p" id="done" type="button">' + esc(T('showN', {n: countShown()})) + '</button>';
}
function closeSheet(){ $('#scrim').hidden = true; document.body.style.overflow = ''; sheetKind = null; }

/* ----- eventi ----- */
function go(c){
  // dentro al menu la scelta lingua sostituisce la voce di cronologia, cosi' "indietro" porta alla prima pagina
  if (!$('#menu').hidden) { try { location.replace('#' + c); } catch (e) { location.hash = c; } }
  else if (location.hash !== '#' + c) location.hash = c;
  route();
}
function goHome(){ closeSheet(); st.q = ''; $('#q').value = ''; $('#srow2').hidden = true; $('#sbtn').setAttribute('aria-pressed', 'false');
  if (location.hash) location.hash = ''; route(); }
document.addEventListener('click', e => {
  if (e.target.closest('#theme')) { mode = mode === 'dark' ? 'light' : 'dark'; store.set('bv-m', mode); applyMode(); return; }
  if (e.target.closest('#home') || e.target.closest('[data-home]')) { e.preventDefault(); goHome(); return; }
  const l = e.target.closest('[data-l]');
  if (l) { e.preventDefault(); closeSheet(); go(l.dataset.l); return; }
  const g = e.target.closest('[data-go]');
  if (g) { const el = document.getElementById(g.dataset.go);
    if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block: 'start'}); return; }
  if (e.target.closest('#sbtn')) { setSearch($('#srow2').hidden); return; }
  if (e.target.closest('#langbtn')) { openSheet('lang'); return; }
  if (e.target.closest('#fbtn')) { openSheet('filter'); return; }
  if (e.target.closest('#xbtn') || e.target.id === 'scrim' || e.target.closest('#done')) { closeSheet(); renderMenu(false); return; }
  const t = e.target.closest('.t');
  if (t && sheetKind === 'filter') {
    if (t.dataset.al) { const a = +t.dataset.al; st.al.has(a) ? st.al.delete(a) : st.al.add(a); }
    else if (t.dataset.diet === 'veg') { st.veg = !st.veg; if (!st.veg) st.vegan = false; }
    else if (t.dataset.diet === 'vegan') { st.vegan = !st.vegan; if (st.vegan) st.veg = true; }
    saveF(); drawFilter(); return; }
  if (e.target.closest('#clr')) { st.al.clear(); st.veg = st.vegan = false; saveF(); drawFilter(); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'hide') { st.hide = e.target.checked; saveF(); drawFilter(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetKind) { closeSheet(); if (!$('#menu').hidden) renderMenu(false); } });
$('#q').addEventListener('input', e => { st.q = e.target.value.trim(); renderMenu(false); });
let tick = false;
window.addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; onScroll(); }); } }, {passive: true});
window.addEventListener('resize', setBarH);

applyMode();
function route(){
  const h = location.hash.replace('#', '');
  if (D.langs.includes(h)) { st.lang = h; store.set('bv-l', h); showMenu(); } else showLanding();
}
window.addEventListener('hashchange', route);
route();
})();
</script>
</body></html>
